# Git settings for the yadm repository only, pulled in by the includeIf in
# ~/.gitconfig. The work tree is $HOME, so the "how do I stage this" advice
# lines are pure noise next to the real diff.
[advice]
	statusHints = false

[alias]
	st = status -sb
	# Tracked changes only: skips the untracked $HOME clutter entirely.
	dirty = status -sb --untracked-files=no

# Hide untracked files in this repo altogether. Left off on purpose: git would
# stop showing new dotfiles that are candidates for tracking.
#[status]
#	showUntrackedFiles = no
