[tools]
"aqua:apache/maven" = "latest"
"aqua:ast-grep/ast-grep" = "latest"
"aqua:gradle/gradle" = "latest"
"github:google/google-java-format" = "latest"
"npm:@qwen-code/qwen-code" = "latest"
"npm:json-sort-cli" = "latest"
"npm:npm-check-updates" = "latest"
"npm:prettier" = "latest"
aws = { version = "latest", symlink_bins = "true" }
bun = "latest"
go = "latest"
java = "lts"
k6 = "latest"
kotlin = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
mongosh = "latest"
node = "lts"
pnpm = "latest"
shellcheck = "latest"
shfmt = "latest"
tflint = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest"
terraform = "latest"
ruff = "latest"
ty = "latest"
fd = "latest"
zoxide = "latest"
rg = "latest"
tealdeer = "latest"
vivid = "latest"
gh = "latest"
lazygit = "latest"
eza = "latest"
fzf = "latest"
"aqua:tailwindlabs/tailwindcss" = "latest"
"aqua:yadm-dev/yadm" = "latest"
rumdl = "latest"
"github:harehare/mq" = "latest"
"npm:opencode-kagi-search" = "latest"
stylua = "latest"
"aqua:Kampfkarren/selene" = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
pi = "latest"
biome = "latest"
terraform-ls = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"
lua-language-server = "latest"
taplo = "latest"
hadolint = "latest"
"npm:fish-lsp" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["java"]
auto_update = true
# Vendor-backed and mainstream tools skip the 24h release-age holdback; small
# third-party packages (json-sort-cli, npm-check-updates, opencode-kagi-search,
# harehare/mq, rumdl) keep it. Entries are short names or full backend IDs.
minimum_release_age_excludes = [
  "aqua:Kampfkarren/selene",
  "aqua:apache/maven",
  "aqua:ast-grep/ast-grep",
  "aqua:gradle/gradle",
  "aqua:tailwindlabs/tailwindcss",
  "aqua:yadm-dev/yadm",
  "aws",
  "bun",
  "eza",
  "fd",
  "fzf",
  "gh",
  "github:google/google-java-format",
  "go",
  "java",
  "k6",
  "kotlin",
  "lazygit",
  "mongosh",
  "node",
  "npm:@qwen-code/qwen-code",
  "npm:prettier",
  "opencode",
  "pnpm",
  "rg",
  "ruff",
  "shellcheck",
  "shfmt",
  "stylua",
  "tealdeer",
  "terraform",
  "tflint",
  "tree-sitter",
  "ty",
  "usage",
  "uv",
  "vivid",
  "zoxide",
]
