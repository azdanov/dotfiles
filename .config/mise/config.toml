[tools]
"aqua:apache/maven" = "latest"
"aqua:ast-grep/ast-grep" = "latest"
"aqua:gradle/gradle" = "latest"
"github:google/google-java-format" = "latest"
"npm:@qwen-code/qwen-code" = "latest"
"npm:json-sort-cli" = "latest"
"npm:npm-check-updates" = "latest"
"npm:prettier" = "latest"
aws = { version = "latest", symlink_bins = "true" }
bun = "latest"
go = "latest"
java = "lts"
k6 = "latest"
kotlin = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
mongosh = "latest"
node = "lts"
pnpm = "latest"
shellcheck = "latest"
shfmt = "latest"
tflint = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest"
terraform = "latest"
ruff = "latest"
ty = "latest"
fd = "latest"
zoxide = "latest"
rg = "latest"
tealdeer = "latest"
vivid = "latest"
gh = "latest"
lazygit = "latest"
eza = "latest"
fzf = "latest"
"aqua:tailwindlabs/tailwindcss" = "latest"
"aqua:yadm-dev/yadm" = "latest"
rumdl = "latest"
"github:harehare/mq" = "latest"
"npm:opencode-kagi-search" = "latest"
stylua = "latest"
"aqua:Kampfkarren/selene" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["java"]
auto_update = true
minimum_release_age_excludes = ["npm:@qwen-code/qwen-code"]
