# Tool configuration for the standalone scripts in this directory.
# There is no package here: lint with `ruff check .`, type check with `ty check .`.

[tool.ruff]
line-length = 100
target-version = "py311"
# Scripts here are extensionless executables.
extend-include = ["roslyn-lsp-ready"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing trailing comma (conflicts with the formatter)
  "CPY001", # missing copyright notice
  "D",      # docstring style (module docstring is kept by convention)
  "ISC001", # implicit string concatenation (conflicts with the formatter)
  "S603",   # subprocess call with a PATH-resolved command (intended here)
  "S607",   # partial executable path (the server comes from PATH here)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.src]
# ty only discovers .py/.pyi files, so the script is listed explicitly.
include = ["roslyn-lsp-ready"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true